# Weekly dependency updates. Minor and patch bumps are grouped into one PR per
# ecosystem; major bumps come as separate PRs. A release must be 7 days old
# before it is proposed, so a hijacked release has time to be pulled.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gomod:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: helm
    directory: /deploy/cpu-pinning-operator
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
