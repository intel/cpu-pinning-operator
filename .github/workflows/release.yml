name: release

# Publishes the operator image with a cosign signature, a signed SPDX SBOM and SLSA
# build provenance, in three jobs: container (build, push, sign), sbom (generate,
# attest), provenance (the SLSA3 container generator).
#
# Every job runs only in the public repository: keyless signing writes the repository
# name to the public Rekor log, so anywhere else the jobs are skipped.
#
# Repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN. They have to be repository
# (or organisation) secrets, not environment ones, because the provenance job calls a
# reusable workflow and such a job cannot take an environment.

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE_REGISTRY: docker.io
  IMAGE_NAME: intel/cpu-pinning-operator

jobs:
  # Builds the image, pushes it, signs it, and outputs the digest.
  container:
    if: github.repository == 'intel/cpu-pinning-operator'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # keyless cosign signature
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The image tag is the version the chart deploys, so the tag must match it.
      - name: Check the tag
        run: |
          set -euo pipefail
          version=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' deploy/cpu-pinning-operator/Chart.yaml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Chart.yaml appVersion $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi

      - name: cosign-installer
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Authenticate Docker
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          # v1.0.0 -> 1.0.0, the tag the chart's appVersion resolves to.
          tags: type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.vendor=Intel Corporation

      # No build cache: a release build must not read a cache other runs can write.
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          platforms: linux/amd64

      - name: Sign the published Docker image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  # Generates an SPDX SBOM of the published image and attests it.
  sbom:
    needs: [container]
    if: github.repository == 'intel/cpu-pinning-operator'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # keyless cosign attestation
    env:
      REF: docker.io/intel/cpu-pinning-operator@${{ needs.container.outputs.digest }}
    steps:
      - name: Generate container SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3
          scan-type: image
          format: spdx-json
          output: sbom.spdx.json
          image-ref: ${{ env.REF }}
          scanners: ""

      - name: cosign-installer
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Authenticate Docker
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The one deliberate deviation from the template: it runs `cosign attach sbom`,
      # which cosign has deprecated, then signs the attached SBOM separately. A signed
      # in-toto attestation does both in one step.
      - name: Attest the SPDX SBOM
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

  # Generates SLSA provenance and pushes it to the registry next to the image.
  provenance:
    needs: [container]
    if: github.repository == 'intel/cpu-pinning-operator'
    permissions:
      actions: read # for detecting the GitHub Actions environment
      id-token: write # for creating OIDC tokens for signing
      packages: write # requested by the generator's jobs; unused for Docker Hub
    # Referenced by tag, not SHA: the generator verifies its own ref and fails otherwise.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: docker.io/intel/cpu-pinning-operator
      digest: ${{ needs.container.outputs.digest }}
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
