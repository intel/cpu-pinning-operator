name: sec-fuzz

on:
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Container-start retries: a runner occasionally fails to start the job container
# with no code defect (image pull failure or rate limit, network allocation
# failures). We do not retry in-workflow; red checks plus one-click re-runs
# surface runner infrastructure health rather than hiding it.

jobs:
  discover:
    runs-on: ubuntu-24.04
    container: golang:1.26
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Discover fuzz targets
        id: list
        run: |
          targets=$(grep -rEn '^func Fuzz' --include='*_fuzz_test.go' internal/ \
            | sed -E 's#^(.*)/[^/]+:[0-9]+:func (Fuzz[A-Za-z0-9_]+).*#./\1 \2#' \
            | sort -u \
            | awk 'BEGIN{printf "["} {if(NR>1)printf ","; printf "{\"pkg\":\"%s\",\"target\":\"%s\"}",$1,$2} END{print "]"}')
          echo "$targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: discover
    runs-on: ubuntu-24.04
    container: golang:1.26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go build and module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Fuzz ${{ matrix.target }}
        id: fuzz
        shell: bash
        run: |
          # One directory for both halves of the crasher handling: the check below
          # asks git what is new in it, and the upload step collects it. Deriving
          # both from one variable is what keeps the artifact from carrying corpora
          # the failing leg never touched.
          pkg="${{ matrix.pkg }}"
          corpus="${pkg#./}/testdata/fuzz"

          set +e
          go test -run='^$' -fuzz='^${{ matrix.target }}$' \
            -fuzztime=${{ github.event_name == 'schedule' && '10m' || '30s' }} \
            -timeout=${{ github.event_name == 'schedule' && '20m' || '5m' }} \
            "$pkg" 2>&1 | tee fuzz-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] && exit 0

          # Fuzz step failed. A crasher is a file go test left behind that git does
          # not track. Listing the files rather than asking `git status` whether the
          # directory is dirty is what lets the log name the reproducer: for a new
          # target `git status --porcelain` collapses the whole directory into one
          # `?? <dir>/` line.
          #
          # This check MUST stay ahead of the classifier below. If the fuzztime
          # deadline lands while a crasher is being minimized, go test writes the
          # reproducer but reports only the deadline — the file on disk is the only
          # evidence, and classifying first would tolerate a real crash.
          crashers=""
          if [ -d "$corpus" ]; then
            crashers="$(git ls-files --others --exclude-standard "$corpus")"
          fi
          if [ -n "$crashers" ]; then
            echo "crasher=true" >> "$GITHUB_OUTPUT"
            echo "corpus_dir=$corpus" >> "$GITHUB_OUTPUT"
            echo "Fuzz leg for ${{ matrix.target }} in $pkg found a crash."
            echo "New corpus files, i.e. the reproducers:"
            echo "$crashers"
            echo "Reproduce locally with:"
            echo "  go test -run='${{ matrix.target }}/<crasher-file>' $pkg"
            while read -r crasher; do
              [ -n "$crasher" ] || continue
              echo "--- $crasher"
              cat "$crasher" || true
            done <<< "$crashers"
            exit 1
          fi

          # No new crasher file. Tolerate ONLY the fuzzing coordinator surfacing its own
          # shutdown at the fuzztime boundary; anything else is a real failure (crash on
          # committed seed, build error, or infrastructure failure). The rule lives in a
          # script so it can be tested: test/fuzzgate runs it over the output shapes go
          # test really emits, including ones the earlier substring match tolerated by
          # mistake (a deadline line next to a real assertion failure, or a deadline
          # belonging to a different target).
          if [ "$(.github/scripts/fuzz/classify-failure.sh '${{ matrix.target }}' fuzz-output.txt)" = deadline ]; then
            echo "::warning::Fuzz leg for ${{ matrix.target }}: coordinator reached fuzztime budget and shut down cleanly; no crasher written"
            exit 0
          fi

          echo "Fuzz leg for ${{ matrix.target }} in $pkg failed without writing a crasher."
          echo "Likely causes: crash on a committed seed input, build error, or infrastructure failure."
          echo "Check the logs above for details."
          exit 1

      - name: Upload crasher
        # corpus_dir is written in the same branch as crasher, so an empty one would
        # mean the step above changed; without this guard the path below would glob
        # from /.
        if: always() && steps.fuzz.outputs.crasher == 'true' && steps.fuzz.outputs.corpus_dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crasher-${{ matrix.target }}
          # The failing package's corpus only — the same directory the step above
          # found the new file in, so the reproducer is the file in here that the
          # log named, not every seed of every target.
          path: ${{ steps.fuzz.outputs.corpus_dir }}/**
          # error, not warn: this step only runs when the step above saw git report a
          # new file in that directory, so an empty artifact would mean the two
          # disagree about the path — which must not pass quietly.
          if-no-files-found: error
