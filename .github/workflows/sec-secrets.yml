name: sec-secrets

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    container: golang:1.26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go build and module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          GITLEAKS="$(go env GOPATH)/bin/gitleaks"
          TRUSTED_CONFIG="$RUNNER_TEMP/gitleaks-trusted.toml"
          printf '[extend]\nuseDefault = true\n' > "$TRUSTED_CONFIG"
          EMPTY_IGNORE="$RUNNER_TEMP/gitleaks-empty-ignore"
          : > "$EMPTY_IGNORE"
          rm -f "$GITHUB_WORKSPACE/.gitleaksignore"
          "$GITLEAKS" git "$GITHUB_WORKSPACE" --config "$TRUSTED_CONFIG" --gitleaks-ignore-path "$EMPTY_IGNORE" --ignore-gitleaks-allow --redact --no-banner
          "$GITLEAKS" dir "$GITHUB_WORKSPACE" --config "$TRUSTED_CONFIG" --gitleaks-ignore-path "$EMPTY_IGNORE" --ignore-gitleaks-allow --redact --no-banner

      # Only a pull_request has a base to diff against; on schedule/dispatch the
      # step would diff main against itself and pass on an empty set.
      - name: Check for internal identifiers
        if: github.event_name == 'pull_request'
        env:
          # Optional. A secret, not a repository variable, and the distinction is the
          # whole point: whatever a repository puts in this list is, by definition, a
          # string it wants kept out of commits. A variable is echoed verbatim into the
          # job log; a secret is masked. Holding the list in a variable would publish,
          # on every run, exactly the strings the guard exists to keep out of the
          # repository. Nothing below prints it either: the failure path names the
          # check, never the pattern and never the matching line.
          #
          # A pull request from a fork receives no secret, so the guard runs reduced
          # there. The step says so rather than passing quietly — see below.
          PRIVATE_IDENTIFIER_PATTERNS: ${{ secrets.PRIVATE_IDENTIFIER_PATTERNS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Prevent accidental commits of internal identifiers.
          #
          # Structural patterns checked in-repo (no personal or system names, defined below):
          # These describe the shape of data without naming anyone:
          # - <abs>/home/<name>    Linux home paths (any user, any system)
          # - <abs>/Users/<name>   macOS home paths (any user, any system)
          #
          # The match must be an ABSOLUTE path, which is what separates a leaked home
          # directory from a repo path that merely contains a directory called "home":
          #   HIT   /home/alice/dev   /var/home/alice   /mnt/c/Users/alice
          #   pass  deploy/examples/home/values.yaml    docs/home/index.md
          # $abs allows the intermediate segments, so an ostree/Silverblue home under
          # /var/home and a WSL-mounted /mnt/c/Users are caught, not just /home directly.
          #
          # $PRIVATE_IDENTIFIER_PATTERNS, when set, holds a |-separated regex
          # alternation of extra person, host or system names to reject; it is wired
          # in via the env: block above and must never be inlined here.
          #
          # Signed-off-by: lines are allowed to contain names per DCO.

          boundary='(^|[^[:alnum:]._/-])'
          abs='(/[[:alnum:]._-]+)*'
          structural_patterns="${boundary}${abs}/home/[[:alnum:]._-]+|${boundary}${abs}/Users/[[:alnum:]._-]+"
          extra_patterns="${PRIVATE_IDENTIFIER_PATTERNS:-}"

          # Combine patterns (or use structural only if extra is unset)
          if [ -n "$extra_patterns" ]; then
            patterns="$structural_patterns|$extra_patterns"
            coverage="filesystem paths, plus the configured person/host/system patterns"
          else
            patterns="$structural_patterns"
            coverage="filesystem paths ONLY — no person, host or system name was looked for"
            # A ::notice:: is collapsed and grey, which is how a guard that looked for
            # nothing came to read as a guard that found nothing. A warning is an
            # annotation on the pull request and the summary is on the run page, so the
            # two modes are told apart by whoever is actually looking.
            echo "::warning::Reduced coverage: PRIVATE_IDENTIFIER_PATTERNS is not set, so only filesystem-path shapes were checked. No person, host or internal system name was looked for, and a pass here does not mean none is present."
            {
              echo "### Internal-identifier check ran with reduced coverage"
              echo
              echo "\`PRIVATE_IDENTIFIER_PATTERNS\` is not set, so this run matched"
              echo "**filesystem-path shapes only**. No person, host or internal system name"
              echo "was looked for. A pass here does not mean none is present."
              echo
              echo "Set it as a repository **secret** to restore the full check. Not as a"
              echo "variable: a variable is printed verbatim into every job log, which would"
              echo "publish the list this guard exists to keep out of the repository."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # The base has to be named and present before a diff against it means anything.
          # An empty BASE_SHA is the trap: git reads "...HEAD" as HEAD against itself and
          # exits 0 with no output, which arrives at the check below as a clean result
          # rather than as a failure to look.
          if [ -z "$BASE_SHA" ]; then
            echo "::error::BASE_SHA is empty, so there was nothing to diff against and this check did not run."
            exit 1
          fi
          if ! git rev-parse --verify --quiet "$BASE_SHA^{commit}" > /dev/null; then
            echo "::error::base commit $BASE_SHA is not in this checkout, so this check did not run."
            exit 1
          fi

          # Inspect only what this PR adds, from the merge base so unrelated commits
          # that landed on the base branch meanwhile are not attributed to it.
          # Skip check files themselves (which must contain pattern definitions to work)
          # --output-indicator-new marks added CONTENT with `>` and leaves the `+++ b/<path>`
          # file headers as they are, which is the only way to tell the two apart. With the
          # default `+`, an added line whose own text starts with `++` becomes `+++…` and is
          # indistinguishable from a header: filtering headers after `cut` then counts them
          # as content, and filtering before `cut` drops that added line from the scan
          # entirely.
          raw="$RUNNER_TEMP/pr-diff"
          added="$RUNNER_TEMP/added-lines"
          if ! git diff -U0 --output-indicator-new='>' "$BASE_SHA...HEAD" \
              -- . ':!.githooks/pre-commit' ':!.github/workflows/sec-secrets.yml' > "$raw"; then
            echo "::error::could not diff $BASE_SHA...HEAD, so this check did not run."
            exit 1
          fi
          # Reading the diff is its own command, not a link in a pipeline: a pipeline
          # reports its rightmost non-zero status, so a failure to read $raw would be
          # masked by the trailing filter's ordinary "matched nothing" exit 1.
          plus="$RUNNER_TEMP/added-raw"
          status=0
          grep '^>' "$raw" > "$plus" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::could not read the diff back (grep exit $status), so this check did not run."
            exit 1
          fi
          # From here on the input is a file this step wrote, so a filter's own
          # "matched nothing" is expected rather than a failure.
          cut -c2- "$plus" | grep -v '^Signed-off-by:' > "$added" || true

          # Say what was read, not just that it passed: a run over zero added lines and a
          # run over a thousand both exit 0, and only one of them proves anything. Zero is
          # reachable — a deletions-only pull request — which is why it is reported rather
          # than failed; the two ways it can mean "nothing was looked at" are refused above.
          echo "inspected $(wc -l < "$added") added line(s) against: $coverage"

          # grep exits 0 on a match, 1 on no match, and 2 or more on an error — which
          # includes a pattern set that does not compile. `if grep -q ...` folds that 2
          # into the no-match branch, so a guard whose patterns are unusable reports as a
          # clean one. Read the status instead.
          # grep's own stderr is dropped rather than shown: on a bad regex some
          # implementations quote the offending pattern back, and log masking covers the
          # secret's exact value, not a fragment of it. The status is what we need here.
          status=0
          grep -qE "$patterns" "$added" 2>/dev/null || status=$?
          case "$status" in
            0)
              echo "::error::Internal identifier found in this PR's changes. Please use generic placeholders or check repository configuration."
              exit 1
              ;;
            1)
              ;;
            *)
              echo "::error::The identifier pattern set did not compile (grep exit $status), so this check did not run. Fix PRIVATE_IDENTIFIER_PATTERNS — it must be a valid POSIX extended regex alternation."
              exit 1
              ;;
          esac
