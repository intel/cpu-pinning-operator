# Per-file Trivy misconfiguration exceptions, for the `trivy config` scan in
# .github/workflows/sec-iac.yml (passed with --ignorefile; Trivy does not discover a
# YAML ignore file on its own).
#
# WHY THIS FILE EXISTS ALONGSIDE .trivyignore
#   .trivyignore can only silence a rule id, repository-wide, which is too blunt for
#   the config-mode scan: that scan renders the Helm chart, so it also reads the
#   vendored third-party subchart, and tolerating a rule for upstream's DaemonSet
#   would stop that rule flagging our own manifests. A YAML ignore file is the only
#   form Trivy accepts `paths:` in, so every entry below is pinned to the file it
#   applies to. .trivyignore serves the filesystem and rendered-chart legs of trivy-image.yml — keep the two in agreement.
#
# WHY SOME PATHS ARE UNDER trivy-helm-hooks/
#   Trivy renders the chart itself but reads only Helm's `Manifest`, and Helm moves
#   every manifest annotated "helm.sh/hook" into a separate `Hooks` list — so the
#   default-enabled uninstall hooks are invisible to the
#   config scan. sec-iac.yml renders them with `helm template --show-only` into
#   trivy-helm-hooks/ so the one scan covers them; those are the paths Trivy then
#   reports, so that is what an exception has to be pinned to. The directory is
#   generated per run and gitignored.
#
# An entry here is a recorded exception, not a resolved finding.
#
# Adding an entry: pin it to a path, say why the finding cannot or should not be
# fixed, and prefer fixing. An unexplained line here is how a real finding becomes
# invisible.

misconfigurations:
  # ---------------------------------------------------------------------------
  # Upstream, not ours: the vendored nri-resource-policy-balloons subchart.
  #
  # The chart ships this subchart enabled by default, so `trivy config` renders and
  # reads it, but its manifests are upstream's. Two reasons they are scoped out here
  # rather than fixed or globally silenced:
  #   - Fixing means patching a vendored third-party chart, which the next version
  #     bump discards. trivy-image.yml keeps a report-only scan of the rendered subchart so the
  #     findings stay visible rather than disappearing.
  #   - Silencing by rule id (the only thing .trivyignore can do) would stop
  #     KSV-0014/0118/0121 and friends flagging OUR Deployment, which is the
  #     coverage this file exists to protect.
  #
  # On KSV-0023/KSV-0121 specifically: the NRI plugin needs /proc and /sys to read
  # CPU topology and drive CRI pinning, so the hostPath mounts are the function of
  # the component. Trivy's hostPath rules carry a fixed severity regardless of what
  # is actually mounted, so the severity says nothing about these two mounts.
  - id: KSV-0011
    paths: ["deploy/cpu-pinning-operator/charts/nri-resource-policy-balloons/templates/daemonset.yaml"]
    statement: "Upstream subchart DaemonSet; a patch to the vendored chart is lost on the next bump, and trivy-image.yml still reports it."
  - id: KSV-0012
    paths: ["deploy/cpu-pinning-operator/charts/nri-resource-policy-balloons/templates/daemonset.yaml"]
    statement: "Upstream subchart DaemonSet; a patch to the vendored chart is lost on the next bump, and trivy-image.yml still reports it."
  - id: KSV-0014
    paths: ["deploy/cpu-pinning-operator/charts/nri-resource-policy-balloons/templates/daemonset.yaml"]
    statement: "Upstream subchart DaemonSet; a patch to the vendored chart is lost on the next bump, and trivy-image.yml still reports it."
  - id: KSV-0018
    paths: ["deploy/cpu-pinning-operator/charts/nri-resource-policy-balloons/templates/daemonset.yaml"]
    statement: "Upstream subchart DaemonSet; a patch to the vendored chart is lost on the next bump, and trivy-image.yml still reports it."
  - id: KSV-0020
    paths: ["deploy/cpu-pinning-operator/charts/nri-resource-policy-balloons/templates/daemonset.yaml"]
    statement: "Upstream subchart DaemonSet; a patch to the vendored chart is lost on the next bump, and trivy-image.yml still reports it."
  - id: KSV-0021
