---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-v1-pod
  failurePolicy: Ignore
  name: mpod.kb.io
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
  sideEffects: None
  timeoutSeconds: 10
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-v1alpha1-balloonpinningpolicy
  failurePolicy: Fail
  name: vbpp.kb.io
  rules:
  - apiGroups:
    - cpu-pinning-operator.intel.com
    apiVersions:
    - v1alpha1
    operations:
    - DELETE
    - UPDATE
    resources:
    - balloonpinningpolicies
  sideEffects: None
  timeoutSeconds: 10
